<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Funny goat face option 1">
  <defs>
    <radialGradient id="fg1" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f0d8a0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>

  <!-- Ears (behind head, drawn first) -->
  <path d="M 48 110 C 34 86, 44 58, 64 68 C 78 74, 78 100, 64 114 Z"
        fill="#f5e8c8" stroke="#1a1008" stroke-width="4"/>
  <path d="M 208 110 C 222 86, 212 58, 192 68 C 178 74, 178 100, 192 114 Z"
        fill="#f5e8c8" stroke="#1a1008" stroke-width="4"/>
  <path d="M 54 108 C 44 88, 50 66, 64 74 C 74 78, 72 98, 64 110 Z" fill="#f4a8a8"/>
  <path d="M 202 108 C 212 88, 206 66, 192 74 C 182 78, 184 98, 192 110 Z" fill="#f4a8a8"/>

  <!-- Lyre-curved horns (drawn before head so face ellipse hides bases) -->
  <path d="M 114 82 C 100 52, 72 22, 44 10 C 40 12, 36 16, 40 20 C 56 42, 84 66, 100 82 Z"
        fill="#b89050" stroke="#8a6830" stroke-width="2"/>
  <path d="M 142 82 C 156 52, 184 22, 212 10 C 216 12, 220 16, 216 20 C 200 42, 172 66, 156 82 Z"
        fill="#b89050" stroke="#8a6830" stroke-width="2"/>

  <!-- Head (covers horn bases so horns appear skull-mounted) -->
  <ellipse cx="128" cy="138" rx="80" ry="66" fill="url(#fg1)" stroke="#1a1008" stroke-width="7"/>

  <!-- Amber eyes with horizontal slit pupils (the unmistakable goat feature) -->
  <circle cx="100" cy="116" r="15" fill="#c8860a" stroke="#1a1008" stroke-width="3"/>
  <rect x="88" y="113" width="24" height="7" rx="3" fill="#1a1208"/>
  <circle cx="95" cy="110" r="3.5" fill="white" opacity="0.8"/>

  <circle cx="156" cy="116" r="15" fill="#c8860a" stroke="#1a1008" stroke-width="3"/>
  <rect x="144" y="113" width="24" height="7" rx="3" fill="#1a1208"/>
  <circle cx="151" cy="110" r="3.5" fill="white" opacity="0.8"/>

  <!-- Trapezoidal muzzle/snout (wider top, rounded bottom) -->
  <path d="M 94 150 L 162 150 C 168 168, 166 186, 152 194 C 140 202, 116 202, 104 194 C 90 186, 88 168, 94 150 Z"
        fill="#ffe8d0" stroke="#1a1008" stroke-width="5"/>
  <!-- Nostrils -->
  <ellipse cx="113" cy="170" rx="10" ry="7" fill="#5a3015"/>
  <ellipse cx="143" cy="170" rx="10" ry="7" fill="#5a3015"/>

  <!-- Happy smile with tongue -->
  <path d="M 108 186 Q 128 202, 148 186" fill="none" stroke="#1a1008" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="128" cy="196" rx="9" ry="7" fill="#ff7a7a"/>

  <!-- Small goatee hanging from chin -->
  <path d="M 114 202 C 108 224, 116 248, 128 252 C 140 248, 148 224, 142 202 C 136 210, 120 210, 114 202 Z"
        fill="#c8a060" stroke="#8a6830" stroke-width="3"/>

  <!-- Blush spots -->
  <ellipse cx="76" cy="148" rx="12" ry="8" fill="#f7bdad" opacity="0.6"/>
  <ellipse cx="180" cy="148" rx="12" ry="8" fill="#f7bdad" opacity="0.6"/>
</svg>
