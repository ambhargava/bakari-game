<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Funny goat face option 3">
  <defs>
    <radialGradient id="fg3" cx="48%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="100%" stop-color="#eac08a"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>

  <!-- Droopy Nubian-style ears (hanging down) -->
  <ellipse cx="42" cy="132" rx="16" ry="32" fill="#fdf0dc" stroke="#704423" stroke-width="4" transform="rotate(10 42 132)"/>
  <ellipse cx="214" cy="132" rx="16" ry="32" fill="#fdf0dc" stroke="#704423" stroke-width="4" transform="rotate(-10 214 132)"/>
  <ellipse cx="42" cy="132" rx="9" ry="20" fill="#f4a8a8" transform="rotate(10 42 132)"/>
  <ellipse cx="214" cy="132" rx="9" ry="20" fill="#f4a8a8" transform="rotate(-10 214 132)"/>

  <!-- Short stubby outward-curving billy-goat horns — bases hidden under face -->
  <path d="M 94 80 C 78 64, 44 58, 30 66 C 28 54, 52 40, 84 52 C 102 60, 110 76, 108 82 Z"
        fill="#a07830" stroke="#6b5020" stroke-width="1.5"/>
  <path d="M 162 80 C 178 64, 212 58, 226 66 C 228 54, 204 40, 172 52 C 154 60, 146 76, 148 82 Z"
        fill="#a07830" stroke="#6b5020" stroke-width="1.5"/>

  <!-- Head (covers horn bases) -->
  <ellipse cx="128" cy="130" rx="80" ry="64" fill="url(#fg3)" stroke="#704423" stroke-width="7"/>

  <!-- Left eye: winking (arc, shut) with lashes -->
  <path d="M 84 116 C 92 104, 112 104, 118 116" fill="none" stroke="#191511" stroke-width="7" stroke-linecap="round"/>
  <path d="M 88 109 L 84 102" stroke="#191511" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 106 L 100 98" stroke="#191511" stroke-width="3" stroke-linecap="round"/>
  <path d="M 113 109 L 116 102" stroke="#191511" stroke-width="3" stroke-linecap="round"/>

  <!-- Right eye: amber iris + horizontal slit pupil -->
  <circle cx="156" cy="116" r="16" fill="#c8860a"/>
  <rect x="143" y="113" width="26" height="7" rx="3" fill="#1a1208"/>
  <circle cx="151" cy="110" r="4" fill="white" opacity="0.9"/>

  <!-- Trapezoidal muzzle/snout -->
  <path d="M 92 150 L 164 150 C 168 164, 166 182, 154 190 C 142 198, 114 198, 102 190 C 90 182, 88 164, 92 150 Z"
        fill="#ffe5cb" stroke="#704423" stroke-width="5"/>
  <!-- Nostrils -->
  <ellipse cx="112" cy="168" rx="9" ry="7" fill="#5e3b25"/>
  <ellipse cx="144" cy="168" rx="9" ry="7" fill="#5e3b25"/>

  <!-- Cheeky asymmetric smirk -->
  <path d="M 108 180 C 122 186, 138 190, 154 180" fill="none" stroke="#5a2e2e" stroke-width="6" stroke-linecap="round"/>

  <!-- Bushy triangular goatee -->
  <path d="M 108 198 L 128 248 L 148 198 C 142 206, 114 206, 108 198 Z"
        fill="#d4b896" stroke="#704423" stroke-width="3"/>

  <!-- Blush -->
  <ellipse cx="76" cy="150" rx="11" ry="8" fill="#f5afa2" opacity="0.75"/>
  <ellipse cx="180" cy="150" rx="11" ry="8" fill="#f5afa2" opacity="0.75"/>
</svg>
