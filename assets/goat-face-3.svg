<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Funny goat face option 3">
  <defs>
    <radialGradient id="fg3" cx="48%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="100%" stop-color="#ead090"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>

  <!-- Droopy Nubian-style ears -->
  <ellipse cx="44" cy="130" rx="16" ry="30" fill="#f5e8c8" stroke="#1a1008" stroke-width="4" transform="rotate(12 44 130)"/>
  <ellipse cx="212" cy="130" rx="16" ry="30" fill="#f5e8c8" stroke="#1a1008" stroke-width="4" transform="rotate(-12 212 130)"/>
  <ellipse cx="44" cy="130" rx="9" ry="19" fill="#f4a8a8" transform="rotate(12 44 130)"/>
  <ellipse cx="212" cy="130" rx="9" ry="19" fill="#f4a8a8" transform="rotate(-12 212 130)"/>

  <!-- Short outward-curving billy-goat horns (drawn before head) -->
  <path d="M 104 84 C 84 66, 46 62, 28 72 C 24 58, 52 44, 82 56 C 102 64, 112 78, 110 84 Z"
        fill="#b89050" stroke="#8a6830" stroke-width="2"/>
  <path d="M 152 84 C 172 66, 210 62, 228 72 C 232 58, 204 44, 174 56 C 154 64, 144 78, 146 84 Z"
        fill="#b89050" stroke="#8a6830" stroke-width="2"/>

  <!-- Head (covers horn bases) -->
  <ellipse cx="128" cy="138" rx="80" ry="66" fill="url(#fg3)" stroke="#1a1008" stroke-width="7"/>

  <!-- Left eye: winking (closed arc with lashes) -->
  <path d="M 84 116 C 94 102, 112 102, 120 116" fill="none" stroke="#1a1208" stroke-width="7" stroke-linecap="round"/>
  <line x1="88" y1="109" x2="84" y2="101" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
  <line x1="101" y1="106" x2="101" y2="97" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="109" x2="118" y2="101" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>

  <!-- Right eye: amber iris + horizontal slit pupil -->
  <circle cx="156" cy="116" r="15" fill="#c8860a" stroke="#1a1008" stroke-width="3"/>
  <rect x="144" y="113" width="24" height="7" rx="3" fill="#1a1208"/>
  <circle cx="151" cy="110" r="3.5" fill="white" opacity="0.8"/>

  <!-- Trapezoidal muzzle/snout -->
  <path d="M 94 150 L 162 150 C 168 168, 166 186, 152 194 C 140 202, 116 202, 104 194 C 90 186, 88 168, 94 150 Z"
        fill="#ffe8d0" stroke="#1a1008" stroke-width="5"/>
  <!-- Nostrils -->
  <ellipse cx="113" cy="170" rx="10" ry="7" fill="#5a3015"/>
  <ellipse cx="143" cy="170" rx="10" ry="7" fill="#5a3015"/>

  <!-- Cheeky asymmetric smirk -->
  <path d="M 108 184 C 124 190, 140 192, 154 182" fill="none" stroke="#1a1208" stroke-width="6" stroke-linecap="round"/>

  <!-- Bushy triangular goatee -->
  <path d="M 108 200 L 128 252 L 148 200 C 140 210, 116 210, 108 200 Z"
        fill="#c8a060" stroke="#8a6830" stroke-width="3"/>

  <!-- Blush -->
  <ellipse cx="76" cy="150" rx="12" ry="8" fill="#f5afa2" opacity="0.6"/>
  <ellipse cx="180" cy="150" rx="12" ry="8" fill="#f5afa2" opacity="0.6"/>
</svg>
